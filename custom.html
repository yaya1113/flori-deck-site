<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定制服务 | 花艺在线</title>
<style>
    header {
  background: #fff0f5;
  box-shadow: 0 2px 5px rgba(0,0,0,.1);
}
header .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
}
header .logo {
  font-size: 28px;
  color: #d14b5a;
  font-weight: bold;
}
header nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
}
header nav ul li a {
  text-decoration: none;
  color: #333;
  font-weight: 500;
  transition: 0.3s;
}
header nav ul li a:hover,
header nav ul li a.active {
  color: #d14b5a;
}
@media(max-width:768px){
  header .container {
    flex-direction: column;
  }
  header nav ul {
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }
}
    /* 定制流程 */
.process{
  padding:60px 20px;
  text-align:center;
  background:#fffafc;
  border-radius:20px;
  margin:40px auto;
}

.process h2{
  font-size:32px;
  color:#d14b5a;
  margin-bottom:40px;
  text-shadow:1px 1px 3px rgba(0,0,0,.1);
}

.process-box{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:30px;
}

.step{
  width:220px;
  padding:20px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  transition:all 0.4s ease;
}

.step:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.step img{
  width:80px;
  height:80px;
  margin-bottom:15px;
  border-radius:50%;
  object-fit:cover;
  transition:all 0.4s ease;
}

.step h3{
  font-size:20px;
  color:#d14b5a;
  margin-bottom:10px;
}

.step p{
  font-size:16px;
  color:#555;
}

/* 服务优势 */
.advantages{
  padding:60px 20px;
  background:linear-gradient(to bottom,#fff0f5,#fffafc);
  text-align:center;
  border-radius:20px;
  margin-bottom:40px;
}

.advantages h2{
  font-size:32px;
  color:#d14b5a;
  margin-bottom:40px;
  text-shadow:1px 1px 3px rgba(0,0,0,.1);
}

.adv-list{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:30px;
}

.adv-card{
  width:220px;
  padding:20px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
  transition:all 0.4s ease;
  text-align:center;
}

.adv-card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.adv-card img{
  width:60px;
  height:60px;
  margin-bottom:15px;
  object-fit:cover;
  border-radius:50%;
}

/* 响应式 */
@media(max-width:768px){
  .process-box, .adv-list{
    flex-direction:column;
    align-items:center;
  }
}
</style>
<link rel="stylesheet" href="css/style.css">
</head>
